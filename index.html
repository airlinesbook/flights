<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SkyLuxe | Premium Airline</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f7fc;
      color: #1a2c3e;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* Navigation */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #0a2540, #0066ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }

    .logo i {
      background: none;
      color: #0066ff;
      margin-right: 6px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 500;
      color: #1f3b4c;
      transition: color 0.2s;
      padding: 6px 0;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #0066ff;
      border-bottom: 2px solid #0066ff;
    }

    /* Page Header */
    .page-header {
      background: linear-gradient(135deg, #eef2f9 0%, #e0e8f2 100%);
      padding: 60px 0 40px;
      margin-bottom: 50px;
      border-radius: 0 0 40px 40px;
    }

    .page-header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: #0a2540;
    }

    .page-header p {
      color: #4a6f8a;
      font-size: 1.1rem;
      margin-top: 12px;
    }

    /* Content Cards */
    .content-card {
      background: white;
      border-radius: 28px;
      padding: 40px;
      margin-bottom: 60px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
    }

    .content-card h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #0a2540;
    }

    .content-card h3 {
      font-size: 1.3rem;
      margin: 24px 0 12px;
      color: #1e4a76;
    }

    .content-card p {
      color: #2c4b66;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .content-card ul {
      margin: 16px 0 16px 24px;
      color: #2c4b66;
    }

    .content-card li {
      margin: 8px 0;
    }

    /* Team Grid */
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      margin: 40px 0 20px;
    }

    .team-card {
      background: #f8fafd;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      width: 240px;
      transition: all 0.3s;
      border: 1px solid #e9eef3;
    }

    .team-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }

    .team-avatar {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #0066ff20, #0a254020);
      border-radius: 60px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #0066ff;
    }

    .team-card h4 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .team-card p {
      color: #6c8dab;
      font-size: 0.85rem;
    }

    /* Contact Form */
    .contact-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 48px;
    }

    .contact-info {
      flex: 1;
      min-width: 250px;
    }

    .contact-detail {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .contact-detail i {
      width: 48px;
      height: 48px;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.3rem;
      color: #0066ff;
    }

    .contact-form {
      flex: 1.5;
      min-width: 280px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #cfdfed;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0,102,255,0.1);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0066ff;
      color: white;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 40px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #0052cc;
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      background: #0a2540;
      color: #cbdde9;
      padding: 50px 0 30px;
      border-radius: 40px 40px 0 0;
      margin-top: 60px;
    }

    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 40px;
    }

    .footer-col h4 {
      color: white;
      margin-bottom: 20px;
    }

    .footer-col ul {
      list-style: none;
    }

    .footer-col li {
      margin-bottom: 10px;
    }

    .footer-col a {
      text-decoration: none;
      color: #b9d0e5;
      transition: 0.2s;
    }

    .footer-col a:hover {
      color: white;
    }

    .copyright {
      text-align: center;
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #1f4562;
      font-size: 0.85rem;
    }

    /* Toast Message */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0a2540;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 500;
      z-index: 1000;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      backdrop-filter: blur(8px);
      background: #1f3b4c;
      pointer-events: none;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 20px;
      }
      .navbar {
        flex-direction: column;
      }
      .page-header h1 {
        font-size: 2rem;
      }
      .content-card {
        padding: 24px;
      }
    }
  </style>
</head>

  // Helper: show toast message
  function showMessage(message, isSuccess = true) {
    let toast = document.querySelector('.toast-msg');
    if (!toast) {
      toast = document.createElement('div');
      toast.className = 'toast-msg';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.backgroundColor = isSuccess ? '#0066ff' : '#c0392b';
    toast.style.opacity = '1';
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
    }, 3000);
  }

  // Render selected page
  function renderPage(pageId) {
    const page = pages[pageId];
    if (!page) return;
    const main = document.getElementById('mainContent');
    main.innerHTML = page.content;
    document.title = `SkyLuxe | ${page.title}`;
    
    // Update active nav link
    document.querySelectorAll('.nav-links a, .footer-col a[data-page]').forEach(link => {
      if (link.getAttribute('data-page') === pageId) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
    
    // Re-attach event handlers if needed (booking form on home, contact form on contact)
    if (pageId === 'home') {
      initHomePageLogic();
    } else if (pageId === 'contact') {
      initContactForm();
    }
  }
  
  // Home page: flight search logic & trip type toggles
  function initHomePageLogic() {
    const departInput = document.getElementById('departDate');
    const returnInput = document.getElementById('returnDate');
    if (departInput) {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2,'0');
      const dd = String(today.getDate()).padStart(2,'0');
      departInput.value = \`\${yyyy}-\${mm}-\${dd}\`;
      const returnDateObj = new Date(today);
      returnDateObj.setDate(today.getDate() + 5);
      const ry = returnDateObj.getFullYear();
      const rm = String(returnDateObj.getMonth()+1).padStart(2,'0');
      const rd = String(returnDateObj.getDate()).padStart(2,'0');
      if(returnInput) returnInput.value = \`\${ry}-\${rm}-\${rd}\`;
    }
    
    // Trip type toggle
    const radioRound = document.querySelector('input[value="round"]');
    const radioOneway = document.querySelector('input[value="oneway"]');
    const returnGroup = document.getElementById('returnGroup');
    function updateTripType() {
      if (radioOneway && radioOneway.checked) {
        if(returnGroup) { returnGroup.style.opacity = '0.5'; if(returnInput) returnInput.disabled = true; if(returnInput) returnInput.required = false; }
      } else {
        if(returnGroup) { returnGroup.style.opacity = '1'; if(returnInput) returnInput.disabled = false; if(returnInput) returnInput.required = true; }
      }
    }
    if(radioRound && radioOneway) {
      radioRound.addEventListener('change', updateTripType);
      radioOneway.addEventListener('change', updateTripType);
      updateTripType();
    }
    // Attach form submit
    const form = document.getElementById('flightSearchForm');
    if(form) {
      form.removeEventListener('submit', handleFlightSubmit);
      form.addEventListener('submit', handleFlightSubmit);
    }
    // Trip option styling
    const tripLabels = document.querySelectorAll('.trip-option');
    tripLabels.forEach(label => {
      label.addEventListener('click', function() {
        tripLabels.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
        const radio = this.querySelector('input');
        if(radio) radio.checked = true;
        updateTripType();
      });
    });
  }
  
  function handleFlightSubmit(e) {
    e.preventDefault();
    const origin = document.getElementById('origin')?.value.trim() || '';
    const dest = document.getElementById('destination')?.value.trim() || '';
    const depart = document.getElementById('departDate')?.value || '';
    const returnVal = document.getElementById('returnDate')?.value || '';
    const passengers = document.getElementById('passengers')?.value || '1 Adult';
    const tripTypeRadio = document.querySelector('input[name="trip"]:checked');
    const trip = tripTypeRadio ? tripTypeRadio.value : 'round';
    if(!origin || !dest) { showMessage('Please enter origin and destination.', false); return; }
    if(!depart) { showMessage('Select departure date.', false); return; }
    if(trip === 'round' && !returnVal) { showMessage('Round trip requires return date.', false); return; }
    if(trip === 'round' && new Date(returnVal) <= new Date(depart)) { showMessage('Return date must be after departure.', false); return; }
    showMessage(\`✈️ Reservation confirmed! \${origin} → \${dest} | \${trip==='round'?'Round-trip':'One-way'} | Depart: \${depart} \${trip==='round'?'↩ '+returnVal:''} | \${passengers}\`, true);
  }
  
  // Contact form handler
  function initContactForm() {
    const contactForm = document.getElementById('contactForm');
    if(contactForm) {
      contactForm.removeEventListener('submit', handleContactSubmit);
      contactForm.addEventListener('submit', handleContactSubmit);
    }
  }
  
  function handleContactSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('contactName')?.value.trim();
    const email = document.getElementById('contactEmail')?.value.trim();
    const subject = document.getElementById('contactSubject')?.value;
    const msg = document.getElementById('contactMsg')?.value.trim();
    if(!name || !email || !msg) {
      showMessage('Please fill all required fields.', false);
      return;
    }
    if(!email.includes('@')) { showMessage('Valid email required.', false); return; }
    showMessage(\`Thanks \${name}! We'll respond within 24 hours.\`, true);
    if(contactForm) contactForm.reset();
  }
  
  // Navigation & page switching
  function setupNavigation() {
    const navLinks = document.querySelectorAll('.nav-links a, .footer-col a[data-page]');
    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.getAttribute('data-page');
        if(page && pages[page]) {
          renderPage(page);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (link.id === 'logoLink') {
          renderPage('home');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
    // Also logo click
    const logo = document.getElementById('logoLink');
    if(logo) {
      logo.addEventListener('click', (e) => {
        e.preventDefault();
        renderPage('home');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  }
  
  // initial load
  renderPage('home');
  setupNavigation();
</script>
</body>
</html>
