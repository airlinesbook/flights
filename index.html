      padding: 0;
      box-sizing: border-box;
    }

      background-color: #f8fafd;
      color: #1a2c3e;
      line-height: 1.5;
    }

    .container {

      margin: 0 auto;
      padding: 0 32px;
    }

    /* Navigation Bar */
    .navbar {

      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #0a2540, #0066ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo i {
      background: none;
      color: #0066ff;
      font-size: 1.6rem;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 600;
      color: #2c4b66;
      transition: all 0.2s;
      padding: 6px 0;
      position: relative;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #0066ff;
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #0066ff;
      border-radius: 2px;
    }

    /* Page Header */
    .page-header {
      background: linear-gradient(135deg, #eef2f9 0%, #e2eaf3 100%);
      padding: 60px 0 48px;
      margin-bottom: 50px;
      border-radius: 0 0 48px 48px;
    }

    .page-header h1 {
      font-size: 3rem;
      font-weight: 800;
      color: #0a2540;
      margin-bottom: 12px;
    }

    .page-header p {
      color: #4a6f8a;
      font-size: 1.2rem;
      max-width: 600px;
    }

    /* Content Cards */
    .content-card {
      background: white;
      border-radius: 28px;
      padding: 48px;
      margin-bottom: 60px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid #eef2f8;
    }

    .content-card h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #0a2540;
    }

    .content-card h3 {
      font-size: 1.4rem;
      margin: 32px 0 16px;
      color: #1e4a76;
    }

    .content-card p {
      color: #2c4b66;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .content-card ul, .content-card ol {
      margin: 20px 0 20px 28px;
      color: #2c4b66;
    }

    .content-card li {
      margin: 10px 0;
      line-height: 1.6;
    }

    /* About Page - Team Grid */
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      margin: 48px 0 20px;
    }

    .team-card {
      background: #f8fafd;
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      width: 260px;
      transition: all 0.3s ease;
      border: 1px solid #e9eef3;
    }

    .team-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
    }

    .team-avatar {
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #0066ff15, #0a254015);
      border-radius: 60px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: #0066ff;
    }

    .team-card h4 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #0a2540;
    }

    .team-card p {
      color: #6c8dab;
      font-size: 0.9rem;
      margin-bottom: 0;
    }

    /* Values Section */
    .values-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      margin: 40px 0 20px;
    }

    .value-item {
      flex: 1;
      min-width: 200px;
      background: #f8fafd;
      padding: 28px;
      border-radius: 24px;
      text-align: center;
    }

    .value-item i {
      font-size: 2.5rem;
      color: #0066ff;
      margin-bottom: 16px;
    }

    .value-item h4 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .contact-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 56px;
    }

    .contact-info {
      flex: 1;
      min-width: 260px;
    }

    .contact-detail {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 32px;
      padding: 12px;
      border-radius: 20px;
      transition: background 0.2s;
    }

    .contact-detail:hover {
      background: #f8fafd;
    }

      width: 52px;
      height: 52px;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      font-size: 1.4rem;
      color: #0066ff;
    }

    .contact-detail strong {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 4px;
      color: #0a2540;
    }

    .contact-form {
      flex: 1.5;
      min-width: 300px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group input, 
    .form-group textarea, 
    .form-group select {
      width: 100%;
      padding: 14px 20px;
      border: 1.5px solid #e2e8f0;
      border-radius: 24px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: all 0.2s;
      background: white;
    }

    .form-group input:focus, 
    .form-group textarea:focus, 
    .form-group select:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
    }

      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0066ff;
      color: white;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 40px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #0052cc;

      color: #cbdde9;

      margin-top: 60px;

    .footer-grid {

      justify-content: space-between;

      margin-bottom: 20px;
      font-size: 1.1rem;

    }

    }

    .footer-col a {

      color: #b9d0e5;
      transition: 0.2s;

      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #1f4562;
      font-size: 0.85rem;

      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0a2540;
      color: white;
      padding: 14px 32px;
      border-radius: 60px;
      font-weight: 500;

      background: #1f3b4c;
      pointer-events: none;
      font-size: 0.95rem;
      white-space: nowrap;
    }

      }

      }
      .content-card {

      }
      .toast-msg {

        text-align: center;
        width: 90%;
      }
    }
  </style>
</head>

  // Toast notification helper
  function showMessage(message, isSuccess = true) {
    let toast = document.querySelector('.toast-msg');
    if (!toast) {
      toast = document.createElement('div');
      toast.className = 'toast-msg';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.backgroundColor = isSuccess ? '#0066ff' : '#c0392b';
    toast.style.opacity = '1';
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
    }, 3200);
  }

  // Render current page with ID
  function renderPage(pageId) {
    const page = pages[pageId];
    if (!page) return;
    const main = document.getElementById('mainContent');
    main.innerHTML = page.content;
    document.title = page.title;

    // Update active nav link
    document.querySelectorAll('.nav-links a, .footer-col a[data-page]').forEach(link => {
      if (link.getAttribute('data-page') === pageId) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });

    // Initialize page-specific scripts
    if (pageId === 'home') initHomePage();
    if (pageId === 'contact') initContactPage();
  }

  // Home page logic: dates, round-trip toggle, form submission
  function initHomePage() {
    const departInput = document.getElementById('departDate');
    const returnInput = document.getElementById('returnDate');
    if (departInput) {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      departInput.value = `${yyyy}-${mm}-${dd}`;
      const returnDateObj = new Date(today);
      returnDateObj.setDate(today.getDate() + 4);
      const ry = returnDateObj.getFullYear();
      const rm = String(returnDateObj.getMonth() + 1).padStart(2, '0');
      const rd = String(returnDateObj.getDate()).padStart(2, '0');
      if (returnInput) returnInput.value = `${ry}-${rm}-${rd}`;
    }

    const radioRound = document.querySelector('input[value="round"]');
    const radioOneway = document.querySelector('input[value="oneway"]');
    const returnGroup = document.getElementById('returnGroup');

    function updateTripType() {
      if (radioOneway && radioOneway.checked) {
        if (returnGroup) { returnGroup.style.opacity = '0.5'; if (returnInput) returnInput.disabled = true; }
      } else {
        if (returnGroup) { returnGroup.style.opacity = '1'; if (returnInput) returnInput.disabled = false; }
      }
    }
    if (radioRound && radioOneway) {
      radioRound.addEventListener('change', updateTripType);
      radioOneway.addEventListener('change', updateTripType);
      updateTripType();
    }

    const flightForm = document.getElementById('flightSearchForm');
    if (flightForm) {
      flightForm.removeEventListener('submit', handleFlightSubmit);
      flightForm.addEventListener('submit', handleFlightSubmit);
    }
  }

  function handleFlightSubmit(e) {
    e.preventDefault();
    const origin = document.getElementById('origin')?.value.trim() || '';
    const dest = document.getElementById('destination')?.value.trim() || '';
    const depart = document.getElementById('departDate')?.value || '';
    const returnVal = document.getElementById('returnDate')?.value || '';
    const passengers = document.getElementById('passengers')?.value || '1 Adult';
    const tripRadio = document.querySelector('input[name="trip"]:checked');
    const trip = tripRadio ? tripRadio.value : 'round';
    if (!origin || !dest) { showMessage('Please enter origin and destination.', false); return; }
    if (!depart) { showMessage('Select a departure date.', false); return; }
    if (trip === 'round' && !returnVal) { showMessage('Round trip requires a return date.', false); return; }
    if (trip === 'round' && new Date(returnVal) <= new Date(depart)) { showMessage('Return date must be after departure.', false); return; }
    showMessage(`✈️ Awesome! ${origin} → ${dest} | ${trip === 'round' ? 'Round-trip' : 'One-way'} | Depart: ${depart} ${trip === 'round' ? '↩ Return: ' + returnVal : ''} | ${passengers}. Booking reference sent to your email.`, true);
  }

  // Contact page form logic
  function initContactPage() {
    const contactForm = document.getElementById('contactForm');
    if (contactForm) {
      contactForm.removeEventListener('submit', handleContactSubmit);
      contactForm.addEventListener('submit', handleContactSubmit);
    }
  }

  function handleContactSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('contactName')?.value.trim();
    const email = document.getElementById('contactEmail')?.value.trim();
    const msg = document.getElementById('contactMsg')?.value.trim();
    if (!name || !email || !msg) {
      showMessage('Please fill in all required fields.', false);
      return;
    }
    if (!email.includes('@')) { showMessage('Please enter a valid email address.', false); return; }
    showMessage(`Thank you ${name}! We've received your message and will respond within 2 hours.`, true);
    contactForm.reset();
  }

  // Navigation setup
  function setupNavigation() {
    const allNavLinks = document.querySelectorAll('.nav-links a, .footer-col a[data-page], #logoLink');
    allNavLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        let pageId = link.getAttribute('data-page');
        if (link.id === 'logoLink') pageId = 'home';
        if (pageId && pages[pageId]) {
          renderPage(pageId);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
  }

  // Initialize default page
  renderPage('home');
  setupNavigation();
</script>
</body>
</html>
